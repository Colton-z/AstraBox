appname = casdoor
httpport = 8000
runmode = prod
copyrequestbody = true
driverName = postgres
# The SSO Compose entry point supplies this through Casdoor's documented
# environment-variable override after reading its service-scoped secret file.
# There is deliberately no repository-known database credential fallback.
dataSourceName =
dbName = casdoor
tableNamePrefix =
showSql = false
redisEndpoint =
defaultStorageProvider =
isCloudIntranet = false
authState = "casdoor"
socks5Proxy = ""
verificationCodeTimeout = 10
initScore = 0
logPostOnly = true
isUsernameLowered = false
origin = "http://127.0.0.1:8087"
originFrontend =
staticBaseUrl = "https://cdn.casbin.org"
isDemoMode = false
batchSize = 100
showGithubCorner = false
forceLanguage = ""
defaultLanguage = "en"
defaultApplication = "app-built-in"
maxItemsForFlatMenu = 7
enableErrorMask = false
enableGzip = true
inactiveTimeoutMinutes =
ldapServerPort = 389
ldapsCertId = ""
ldapsServerPort = 636
radiusServerPort = 1812
radiusDefaultOrganization = "built-in"
radiusSecret = "secret"
quota = {"organization": -1, "user": -1, "application": -1, "provider": -1}
logConfig = {"adapter":"console"}
# Seed only missing objects. With false, Casdoor deletes and recreates matching
# users/applications on every restart, undoing an operator's password and OIDC
# client-secret rotations.
initDataNewOnly = true
initDataFile = "/run/astrabox-casdoor/init_data.json"
frontendBaseDir = "../cc_0"
