# Hermes keeps the real listener on loopback. An owner-UID upstream connection
# lets Hermes verify and consume its own one-use browser ticket.
worker_processes 1;
pid nginx.pid;
error_log stderr warn;
events { worker_connections 1024; }

http {
    access_log off;
    client_body_temp_path client_body;
    proxy_temp_path proxy;
    fastcgi_temp_path fastcgi;
    uwsgi_temp_path uwsgi;
    scgi_temp_path scgi;

    map $http_upgrade $connection_upgrade {
        "" "";
        default upgrade;
    }

    upstream hermes_webapp {
        server 127.0.0.1:9120;
        keepalive 32;
    }

    # OpenSandbox replaces Host with the Pod address. The HTTPS terminator sets
    # X-Forwarded-Host to the original browser authority for HTTP and WebSocket.
    map $http_origin $browser_origin {
        "" https://$http_x_forwarded_host;
        default $http_origin;
    }
    map $http_origin $upstream_origin {
        "" "";
        default http://127.0.0.1:9120;
    }

    server {
        listen 9121;
        server_tokens off;
        absolute_redirect off;
        client_max_body_size 0;
        set $gateway_origin https://$http_x_forwarded_host;
        if ($browser_origin != $gateway_origin) { return 403; }

        location / {
            proxy_pass http://hermes_webapp;
            proxy_http_version 1.1;
            proxy_set_header Host 127.0.0.1:9120;
            proxy_set_header Origin $upstream_origin;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Forwarded "";
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Forwarded-Host "";
            proxy_set_header X-Forwarded-Port "";
            proxy_set_header X-Forwarded-Prefix "";
            proxy_set_header X-Forwarded-Proto "";
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 3600s;
        }
    }
}
