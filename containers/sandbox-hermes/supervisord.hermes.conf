# AstraBox — Hermes' gateway daemon as a service of the AIO base image.
#
# Registered the way the base image registers its own services: a program file
# under /opt/gem/supervisord/, which /etc/supervisord.conf includes by glob.
#
# autorestart is why these are supervised programs rather than lines in an
# entrypoint: one gateway serves every conversation of the workspace it holds,
# and a box whose gateway died with nothing to restart it is a box that reports
# healthy and answers nothing.
#
# Each runs as root and drops to the profile's own Linux account itself — that
# account is created by host-side identity provisioning after the box exists,
# so it cannot be named here, only read out of the profile env file the same
# provisioning writes.
[program:astrabox-hermes]
command=/usr/local/bin/astrabox-hermes-serve
autorestart=true
stopwaitsecs=20
stopasgroup=true
killasgroup=true
priority=60
stdout_logfile=%(ENV_LOG_DIR)s/astrabox-hermes.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=10
redirect_stderr=true

[program:astrabox-hermes-state-mirror]
command=/usr/local/bin/astrabox-hermes-serve --mirror
autorestart=unexpected
exitcodes=0,65,78
stopwaitsecs=20
stopasgroup=true
killasgroup=true
priority=62
stdout_logfile=%(ENV_LOG_DIR)s/astrabox-hermes-state-mirror.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
redirect_stderr=true

# The one hop that makes the gateway's loopback, ticket-gated WebSocket
# reachable from the host. hermes_gateway_bridge.py explains what it does for
# each connection, and why it publishes its port only once the gateway is ready.
[program:astrabox-hermes-bridge]
command=/usr/local/bin/astrabox-hermes-serve --bridge
autorestart=true
stopwaitsecs=10
stopasgroup=true
killasgroup=true
priority=61
stdout_logfile=%(ENV_LOG_DIR)s/astrabox-hermes-bridge.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
redirect_stderr=true
