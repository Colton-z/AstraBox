# AstraBox — Hermes' headless backend as a service of the AIO base image.
#
# Registered the way the base image registers its own services: a program file
# under /opt/gem/supervisord/, which /etc/supervisord.conf includes by glob.
#
# autorestart is why these are supervised programs rather than lines in an
# entrypoint: one backend serves every conversation of the workspace it holds,
# and a box whose backend died with nothing to restart it is a box that reports
# healthy and answers nothing.
#
# Runs as root and drops to the profile's own Linux account itself — that
# account is created by host-side identity provisioning after the box exists,
# so it cannot be named here, only read out of the profile env file the same
# provisioning writes.
[program:astrabox-hermes]
command=/usr/local/bin/astrabox-hermes-serve
autorestart=true
stopwaitsecs=20
stopasgroup=true
killasgroup=true
priority=60
stdout_logfile=%(ENV_LOG_DIR)s/astrabox-hermes.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=10
redirect_stderr=true

[program:astrabox-hermes-state-mirror]
command=/usr/local/bin/astrabox-hermes-serve --mirror
autorestart=unexpected
exitcodes=0,65,78
stopwaitsecs=20
stopasgroup=true
killasgroup=true
priority=62
stdout_logfile=%(ENV_LOG_DIR)s/astrabox-hermes-state-mirror.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
redirect_stderr=true

# The one hop that makes the loopback-bound backend reachable from the host.
# See astrabox-hermes-serve for why the backend may not bind outward, and
# astrabox-hermes-forward for why this waits for an answer before binding.
[program:astrabox-hermes-forward]
command=/usr/local/bin/astrabox-hermes-forward
autorestart=true
stopwaitsecs=10
priority=61
stdout_logfile=%(ENV_LOG_DIR)s/astrabox-hermes-forward.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
redirect_stderr=true
