# AstraBox's overlay on the harness's own web profile.
#
# The session log can be mirrored out of the box.
# The harness keeps each conversation in an append-only artifact and defaults
# it to checksummed Zstandard frames; `none` selects the same log as plain
# JSONL (`logSuffix` in the backend's own format module returns `.jsonl` for
# it). Both encodings are the vendor's, and the choice between them is the
# vendor's config field, and both encodings are the vendor's own.
#
# Why plaintext. A box is disposable and the conversation is not, so the log
# has to leave while the box lives. Compressed, the only safe boundary to stop
# a batch at is the start of the LAST frame, which is written when the NEXT
# turn begins — a mirror that could never be less than one whole turn behind.
# Uncompressed, the boundary is the last newline, and the exposure window is
# whatever is mid-write.
#
# `root` is repeated because a patch entry REPLACES the config it targets
# rather than merging into it (measured with `--dump-config`), and the backend
# declares no default for it: "a default of `process.cwd()` would scatter
# session files as the process's cwd changes".
- id: session-persistence-jsonl
  config:
    root: !!js dshHomePath('sessions')
    compression: none

# Native normalization and immutable publication stay in attachment-local.
# The image-owned subclass acknowledges database custody before returning refs.
# A patch's name is a match guard, not a replacement module. Disable the
# supplier row and insert the subclass through the supported composition path.
- id: attachment-local
  disabled: true

- insert:
    - id: astrabox-attachments
      name: /opt/dsh/attachments.mjs
    # Only the platform collector uses this exclusive carrier. The vendor's mux,
    # authentication and native browser routes remain owned by the web profile.
    - id: astrabox-output
      name: /opt/dsh/output.mjs
    - id: astrabox-platform-mcp
      name: /opt/dsh/platform-mcp.mjs
