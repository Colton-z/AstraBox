# AstraBox — the harness API server as a service of the AIO base image.
#
# Registered the way the base image registers its own services: a program file
# under /opt/gem/supervisord/, which /etc/supervisord.conf includes by glob.
# Boot order matters — the workload account is created by the trusted init
# stage before supervisord starts, so %(ENV_USER)s already resolves here.
#
# autorestart keeps the box-level harness endpoint available after a process
# exit. Per-account conversations launch separate services through
# serve-conversation.sh; these programs do not supervise those services.
# Runs as root and drops to %(ENV_USER)s itself (see serve.sh): the working
# directory the platform pre-creates is root-owned, and handing it to the
# workload account is the one thing that has to happen before the server —
# which does run as that account — can let an agent write in its own workspace.
[program:astrabox-dsh]
environment=HOME="/home/%(ENV_USER)s",USER="%(ENV_USER)s"
command=/opt/dsh/serve.sh
autorestart=true
stopwaitsecs=20
priority=60
stdout_logfile=%(ENV_LOG_DIR)s/astrabox-dsh.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=10
redirect_stderr=true

# The one hop that makes the loopback-bound server reachable from the host.
# See astrabox-dsh-serve for why the server itself may not bind outward. Bytes
# are forwarded verbatim — no header is rewritten, so the harness's own Host
# fence still sees what the caller sent, and one TCP proxy covers both the HTTP
# gateway and its WebSocket downlinks. It waits for the server to answer before
# binding, which is what makes this port's acceptance the platform's readiness
# signal rather than a promise the box has not kept (see astrabox-dsh-forward).
[program:astrabox-dsh-forward]
environment=HOME="/home/%(ENV_USER)s",USER="%(ENV_USER)s"
command=/opt/dsh/forward.sh
autorestart=true
stopwaitsecs=10
priority=61
user=%(ENV_USER)s
stdout_logfile=%(ENV_LOG_DIR)s/astrabox-dsh-forward.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
redirect_stderr=true

# The transcript mirror — the same program the Codex image runs, told by this
# image's environment which files the harness keeps its conversations in.
#
# A service of the image rather than a harness plugin. The harness composes its
# profile from bundles and patch layers, so a persistence backend of ours would
# be a legitimate place to put this; it is not taken because that interface
# ships at 0.1.0-rc and because a backend would have to re-serialize events
# into the harness's own file format to restore one, where relaying bytes needs
# to understand nothing. `profile.patch.yml` selects the plaintext encoding the
# relay reads; that is a vendor config field, not a format of ours.
[program:astrabox-dsh-mirror]
environment=HOME="/home/%(ENV_USER)s",USER="%(ENV_USER)s"
command=/usr/bin/env python3 /opt/dsh/mirror.py
autorestart=true
stopwaitsecs=15
priority=62
user=%(ENV_USER)s
stdout_logfile=%(ENV_LOG_DIR)s/astrabox-dsh-mirror.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
redirect_stderr=true
