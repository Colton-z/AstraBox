# DNS-only forwarder used as the OpenSandbox egress sidecar's DNS upstream, so
# a sandbox is never pointed at the AstraBox server itself. It forwards DNS to
# the resolver in the AstraBox server (Compose service `server`, port 5353),
# which answers the private model-gateway name. The server is reached over the
# private network it connects this container to at startup; Docker's embedded
# DNS resolves its name per query, so nginx starts before that network is
# attached. No HTTP server runs here.
worker_processes 1;

events {
    worker_connections 512;
}

stream {
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 53 udp;
        set $astrabox_dns server:5353;
        proxy_pass $astrabox_dns;
        proxy_responses 1;
        proxy_timeout 10s;
    }

    server {
        listen 53;
        set $astrabox_dns server:5353;
        proxy_pass $astrabox_dns;
        proxy_timeout 10s;
    }
}
