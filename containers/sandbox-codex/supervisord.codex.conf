# AstraBox — the Codex app-server as a service of the AIO base image.
#
# Registered the way the base image registers its own services: a program file
# under /opt/gem/supervisord/, which /etc/supervisord.conf includes by glob.
# Boot order matters — the workload account is created by the trusted init
# stage before supervisord starts, so %(ENV_USER)s already resolves here.
#
# autorestart is the reason these are supervised programs rather than lines in
# an entrypoint script: the app-server holds every thread in the box, and a box
# whose server died with nothing to restart it is a box that reports healthy
# and answers nothing.
# Runs as root and drops to %(ENV_USER)s itself (see astrabox-codex-serve):
# the working directory the platform pre-creates is root-owned, and handing it
# to the workload account is the one thing that has to happen before the
# server — which does run as that account — can let an agent write in its own
# workspace.
[program:astrabox-codex]
environment=HOME="/home/%(ENV_USER)s",USER="%(ENV_USER)s"
command=/opt/codex/serve.sh
autorestart=true
stopwaitsecs=20
priority=60
stdout_logfile=%(ENV_LOG_DIR)s/astrabox-codex.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=10
redirect_stderr=true

# The one hop that makes the unix-socket server reachable from the host. See
# astrabox-codex-serve for why the server listens on a socket rather than a
# port, and astrabox-codex-forward for the two things this hop does: it waits
# for the server to complete a websocket upgrade before binding, which is what
# makes this port's acceptance the platform's readiness signal rather than a
# promise the box has not kept, and it drops the compression offer the sandbox
# proxy makes on the adapter's behalf, which this server answers with silence.
[program:astrabox-codex-forward]
environment=HOME="/home/%(ENV_USER)s",USER="%(ENV_USER)s"
command=/usr/bin/env python3 /opt/codex/forward.py
autorestart=true
stopwaitsecs=10
priority=61
user=%(ENV_USER)s
stdout_logfile=%(ENV_LOG_DIR)s/astrabox-codex-forward.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
redirect_stderr=true

# The transcript mirror. Runs as a service of the image, not as a Codex hook:
# hooks are user configuration (opt-in feature, trust recorded against a hash
# that plugin installs change), and a platform guarantee may not rest on
# something a user can turn off. See astrabox-codex-mirror for why the bytes
# are relayed rather than parsed, and why a box that cannot reach the store
# refuses to run instead of running unmirrored.
#
# Starts after the server so the sessions directory exists, but does not depend
# on it: there is nothing to mirror until a thread is created, and the mirror
# adopts files as they appear.
[program:astrabox-codex-mirror]
environment=HOME="/home/%(ENV_USER)s",USER="%(ENV_USER)s"
command=/usr/bin/env python3 /opt/codex/mirror.py
autorestart=true
stopwaitsecs=15
priority=62
user=%(ENV_USER)s
stdout_logfile=%(ENV_LOG_DIR)s/astrabox-codex-mirror.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
redirect_stderr=true
