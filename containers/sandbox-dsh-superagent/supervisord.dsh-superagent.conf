# AstraBox — dsh-superagent as services of the AIO base image.
#
# Each program starts as root and waits for the Assistant's profile and this
# box's initialization gate (astrabox-dsh-superagent-serve), then runs as the
# Assistant's account. The hop needs no profile: it only forwards to the
# harness and refuses panel API requests without the harness's login.
[program:astrabox-dsh-superagent]
command=/usr/local/bin/astrabox-dsh-superagent-serve
autorestart=true
stopwaitsecs=300
priority=60
stdout_logfile=%(ENV_LOG_DIR)s/astrabox-dsh-superagent.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=10
redirect_stderr=true

[program:astrabox-dsh-superagent-state]
command=/usr/local/bin/astrabox-dsh-superagent-serve --mirror
autorestart=true
stopwaitsecs=30
priority=61
stdout_logfile=%(ENV_LOG_DIR)s/astrabox-dsh-superagent-state.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
redirect_stderr=true

[program:astrabox-dsh-superagent-hop]
command=/usr/local/bin/astrabox-dsh-superagent-serve --hop
autorestart=true
stopwaitsecs=10
priority=62
stdout_logfile=%(ENV_LOG_DIR)s/astrabox-dsh-superagent-hop.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
redirect_stderr=true
