# The browser's way to the superagent panel.
#
# The signed sandbox gateway delivers a browser request with the gateway's view of the
# address: the box's own IP as Host and the console's signed hostname as Origin. The
# harness's panel API answers only a loopback authority with a same-origin Origin (its
# guard against DNS rebinding and cross-site requests), so this hop re-addresses every
# request to the loopback server it is for.
#
# Re-addressing removes that guard, and the panel API checks no login of its own: a
# request that reached this port would control the agent. So every panel API request
# first proves the harness's own login — the HttpOnly, SameSite=Strict cookie the launch
# URL sets — by asking the harness itself (`auth_request`). The rest of the harness's
# routes check that login themselves. Reaching this port at all already takes the
# gateway's signature, which only the Assistant's owner is issued.
worker_processes 1;
pid /tmp/astrabox-panel-hop.pid;
error_log stderr warn;
events { worker_connections 256; }
http {
  access_log off;
  client_body_temp_path /tmp/astrabox-panel-hop-body;
  proxy_temp_path /tmp/astrabox-panel-hop-proxy;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  # A location that sets any proxy header inherits none from the server level, so the
  # headers are set here once and only the login check, which must differ, sets its own
  # complete list.
  server {
    listen 0.0.0.0:44790;
    proxy_http_version 1.1;
    proxy_set_header Host 127.0.0.1:44781;
    proxy_set_header Origin http://127.0.0.1:44781;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 1h;
    proxy_buffering off;
    client_max_body_size 16m;

    location = /.astrabox-login {
      internal;
      proxy_pass http://127.0.0.1:44781/;
      proxy_method HEAD;
      proxy_pass_request_body off;
      proxy_set_header Host 127.0.0.1:44781;
      proxy_set_header Origin http://127.0.0.1:44781;
      proxy_set_header Content-Length "";
      proxy_set_header Upgrade "";
      proxy_set_header Connection "";
    }

    location /orchestrator/ {
      auth_request /.astrabox-login;
      proxy_pass http://127.0.0.1:44781;
    }

    location / {
      proxy_pass http://127.0.0.1:44781;
    }
  }
}
