# AstraBox — the transcript mirror as a service of the pi image.
#
# Registered the way the base image registers its own services: a program file
# under /opt/gem/supervisord/, which /etc/supervisord.conf includes by glob. The
# workload account is created by the trusted init stage before supervisord
# starts, so %(ENV_USER)s already resolves here.
#
# This is the only supervised program this image adds, and pi itself is not one.
# Pi's headless surface owns a single conversation on the stdin and stdout of a
# process the adapter starts through execd, so between turns there is nothing to
# keep alive. The mirror is the opposite: it has to outlive every process in the
# box, because what it relays is the only copy of the conversation.
#
# A service of the image rather than a pi extension. Extensions are user
# configuration, and a platform obligation may not rest on something a user can
# switch off — the failure is silent until someone tries to resume. See
# astrabox-transcript-mirror for why the bytes are relayed rather than parsed,
# and why a box that cannot reach the store refuses to run instead of running
# unmirrored.
[program:astrabox-pi-mirror]
environment=HOME="/home/%(ENV_USER)s",USER="%(ENV_USER)s"
command=/usr/bin/env python3 /opt/pi/mirror.py
autorestart=true
stopwaitsecs=15
priority=62
user=%(ENV_USER)s
stdout_logfile=%(ENV_LOG_DIR)s/astrabox-pi-mirror.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
redirect_stderr=true
