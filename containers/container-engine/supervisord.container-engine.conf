# AstraBox — the rootless container engine as a service of the AIO base image.
#
# Present in every box of an image that carries the engine, and inert unless
# the box was created with ASTRABOX_CONTAINER_ENGINE=docker: the program then
# exits 0 at once and supervisord leaves it exited. Exit status 3 means the box
# cannot run the engine (a missing grant); the reason is in
# /run/astrabox-container-engine/failure and restarting cannot change it, so
# it is expected too. Any other exit is the daemon dying, which is restarted.
[program:astrabox-container-engine]
command=/usr/local/bin/astrabox-container-engine serve
user=root
autorestart=unexpected
exitcodes=0,3
startsecs=0
stopasgroup=true
killasgroup=true
stopwaitsecs=20
priority=55
stdout_logfile=%(ENV_LOG_DIR)s/astrabox-container-engine.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
redirect_stderr=true
