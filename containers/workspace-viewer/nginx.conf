user root;
worker_processes 1;
pid /run/astrabox-workspace-viewer/nginx.pid;
error_log stderr warn;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    types { application/javascript mjs; }
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    sendfile on;
    etag off;
    if_modified_since off;
    autoindex off;
    client_max_body_size 1k;
    server {
        listen 8003;
        absolute_redirect off;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Access-Control-Allow-Origin "*" always;
        location = /health { return 204; }
        location ~ "^/b/(?<browser_expires>[0-9]+)/(?<browser_signature>[A-Za-z0-9_-]+)/ws$" {
            secure_link "$browser_signature,$browser_expires";
            secure_link_md5 "$secure_link_expires/browser @PREVIEW_SECRET@";
            if ($secure_link = "") { return 403; }
            if ($secure_link = "0") { return 410; }
            proxy_pass http://127.0.0.1:6080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host "127.0.0.1";
            proxy_read_timeout 3600s;
        }
        location ~ "^/b/(?<browser_expires>[0-9]+)/(?<browser_signature>[A-Za-z0-9_-]+)/(?<browser_asset>.*)$" {
            secure_link "$browser_signature,$browser_expires";
            secure_link_md5 "$secure_link_expires/browser @PREVIEW_SECRET@";
            if ($secure_link = "") { return 403; }
            if ($secure_link = "0") { return 410; }
            if ($request_method !~ ^(GET|HEAD)$) { return 405; }
            alias /opt/novnc/$browser_asset;
            disable_symlinks on;
        }
        location / { return 404; }
    }
    server {
        listen 8002;
        absolute_redirect off;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Content-Security-Policy "sandbox allow-scripts; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'" always;
        location = /health { return 204; }
        location ~ "^/p/(?<preview_expires>[0-9]+)/(?<preview_signature>[A-Za-z0-9_-]+)/(?<preview_root>.+?)/-/(?<preview_file>.*)$" {
            secure_link "$preview_signature,$preview_expires";
            secure_link_md5 "$secure_link_expires/files/$preview_root @PREVIEW_SECRET@";
            if ($secure_link = "") { return 403; }
            if ($secure_link = "0") { return 410; }
            if ($request_method !~ ^(GET|HEAD)$) { return 405; }
            alias /$preview_root/$preview_file;
            disable_symlinks on;
        }
        location / { return 404; }
    }
}
