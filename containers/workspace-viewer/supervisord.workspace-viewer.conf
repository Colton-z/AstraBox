[program:astrabox-workspace-viewer]
command=/usr/local/bin/astrabox-workspace-viewer serve
user=root
autorestart=true
priority=60
stopasgroup=true
killasgroup=true
stdout_logfile=%(ENV_LOG_DIR)s/astrabox-workspace-viewer.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
redirect_stderr=true
