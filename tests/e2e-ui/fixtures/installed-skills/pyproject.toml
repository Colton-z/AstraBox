[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "astrabox-test-skills"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = ["astrabox>=0.1.7"]

[project.entry-points."astrabox.providers.skills"]
fixture_content = "astrabox_test_skills:FixtureContent"
fixture_other = "astrabox_test_skills:OtherContent"

[tool.hatch.build.targets.wheel]
packages = ["astrabox_test_skills"]
