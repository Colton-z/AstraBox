apiVersion: apps/v1
kind: Deployment
metadata:
  name: astrabox-e2e-credential-request-probe
  labels:
    app.kubernetes.io/name: astrabox-e2e-credential-request-probe
    app.kubernetes.io/part-of: astrabox-e2e
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: astrabox-e2e-credential-request-probe
  template:
    metadata:
      labels:
        app.kubernetes.io/name: astrabox-e2e-credential-request-probe
    spec:
      automountServiceAccountToken: false
      containers:
        - name: probe
          image: python:3.12-alpine
          imagePullPolicy: IfNotPresent
          command: ["python", "-u", "-c"]
          args:
            - |
              import os
              from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

              expected = os.environ["EXPECTED_AUTHORIZATION"]

              class Handler(BaseHTTPRequestHandler):
                  def _reply(self):
                      if self.path == "/healthz":
                          self.send_response(200)
                      elif (
                          self.command == "GET"
                          and self.path == "/allowed"
                          and self.headers.get("Authorization") == expected
                      ):
                          self.send_response(204)
                      else:
                          self.send_response(401)
                      self.send_header("Content-Length", "0")
                      self.end_headers()

                  do_GET = _reply
                  do_POST = _reply

                  def log_message(self, _format, *_args):
                      return

              ThreadingHTTPServer(("0.0.0.0", 80), Handler).serve_forever()
          env:
            - name: EXPECTED_AUTHORIZATION
              value: Bearer astrabox-e2e-request-match-secret
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            timeoutSeconds: 1
          resources:
            requests:
              cpu: 10m
              memory: 24Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["NET_BIND_SERVICE"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: astrabox-e2e-credential-request-probe
  labels:
    app.kubernetes.io/name: astrabox-e2e-credential-request-probe
    app.kubernetes.io/part-of: astrabox-e2e
spec:
  selector:
    app.kubernetes.io/name: astrabox-e2e-credential-request-probe
  ports:
    - name: http
      port: 80
      targetPort: http
