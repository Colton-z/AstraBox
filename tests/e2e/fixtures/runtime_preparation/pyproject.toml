[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "astrabox-runtime-preparation-fixture"
version = "0.0.1"

[project.entry-points."astrabox.providers.runtime_preparation"]
fixture = "preparation_fixture:PreparationFixture"

[project.entry-points."astrabox.api.routers"]
preparation_guard_fixture = "preparation_fixture:register_guard_routes"

[tool.setuptools]
py-modules = ["preparation_fixture"]
