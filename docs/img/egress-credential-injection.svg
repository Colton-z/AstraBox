<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" id="fig-egress-credential-injection" viewBox="0 0 1080 400"
     role="img" aria-labelledby="egress-credential-injection-title egress-credential-injection-desc">
  <title id="egress-credential-injection-title">Where the real credential is added</title>
  <desc id="egress-credential-injection-desc">The Agent program and an isolated terminal run in the sandbox, and each one reads an opaque placeholder instead of a key. Their outbound requests reach a compatible sandbox's outbound proxy, which keeps the real credentials and adds one only when a request's host, method, and path match its rules. The request reaches the model gateway or an allowed API host carrying the real value. The AstraBox service writes the real values and matching rules after the sandbox starts.</desc>

  <style data-standalone="true">
    @media (prefers-color-scheme: dark) {
      svg {
        --ifm-background-color: #0e0e0e;
        --fg-1: #ededed;
        --fg-3: #909090;
        --fg-4: #6f6f6f;
        --line-strong: #383838;
        --astra: #7877ff;
        --astra-tint: #1a1b3a;
        --plasma: #f08a59;
      }
    }
  </style>

  <style>
    #fig-egress-credential-injection .box { fill: var(--ifm-background-color, #fafafa); stroke: var(--line-strong, #d4d4d4); stroke-width: 1 }
    #fig-egress-credential-injection .focal { fill: var(--astra-tint, #ecebff); stroke: var(--astra, #5c5bff); stroke-width: 1.5 }
    #fig-egress-credential-injection .zone { fill: none; stroke: var(--line-strong, #d4d4d4); stroke-width: 1; stroke-dasharray: 4 4 }
    #fig-egress-credential-injection .mask { fill: var(--ifm-background-color, #fafafa) }
    #fig-egress-credential-injection .edge { fill: none; stroke: var(--fg-4, #999999); stroke-width: 1.25 }
    #fig-egress-credential-injection .edge-dashed { fill: none; stroke: var(--fg-4, #999999); stroke-width: 1.25; stroke-dasharray: 3 4 }
    #fig-egress-credential-injection .edge-out { fill: none; stroke: var(--plasma, #e8754a); stroke-width: 1.25 }
    #fig-egress-credential-injection .name { fill: var(--fg-1, #0a0a0a); font: 600 12px Geist, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; text-anchor: middle }
    #fig-egress-credential-injection .sub { fill: var(--fg-3, #666666); font: 400 9px "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace; text-anchor: middle }
    #fig-egress-credential-injection .eyebrow { fill: var(--fg-3, #666666); font: 500 8px "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: 0.14em }
    #fig-egress-credential-injection .arrow-label { fill: var(--fg-3, #666666); font: 400 8px "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: 0.06em; text-anchor: middle }
    #fig-egress-credential-injection .legend-text { fill: var(--fg-3, #666666); font: 400 8px "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: 0.06em }
    #fig-egress-credential-injection .rule { stroke: var(--line-strong, #d4d4d4); stroke-width: 0.8 }
  </style>

  <defs>
    <marker id="egress-credential-injection-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="var(--fg-4, #999999)"/>
    </marker>
    <marker id="egress-credential-injection-arrow-out" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="var(--plasma, #e8754a)"/>
    </marker>
  </defs>

  <!-- zone first, then arrows, then boxes: nodes paint over the lines -->
  <rect class="zone" x="8" y="64" width="352" height="224" rx="12"/>
  <text class="eyebrow" x="24" y="52">SANDBOX PROCESSES</text>

  <path class="edge" d="M 344 240 H 396 V 136"/>
  <path class="edge" d="M 344 136 H 448" marker-end="url(#egress-credential-injection-arrow)"/>
  <path class="edge-dashed" d="M 584 248 V 192" marker-end="url(#egress-credential-injection-arrow)"/>
  <path class="edge-out" d="M 720 136 H 776 V 80 H 848" marker-end="url(#egress-credential-injection-arrow-out)"/>
  <path class="edge-out" d="M 720 136 H 776 V 192 H 848" marker-end="url(#egress-credential-injection-arrow-out)"/>

  <rect class="mask" x="364" y="116" width="64" height="12" rx="2"/>
  <text class="arrow-label" x="396" y="125">PLACEHOLDER</text>
  <rect class="mask" x="736" y="60" width="96" height="12" rx="2"/>
  <text class="arrow-label" x="784" y="69">REAL GATEWAY KEY</text>
  <rect class="mask" x="740" y="200" width="88" height="12" rx="2"/>
  <text class="arrow-label" x="784" y="209">REAL API TOKEN</text>
  <rect class="mask" x="592" y="208" width="136" height="12" rx="2"/>
  <text class="arrow-label" x="660" y="217">REAL VALUES · MATCH RULES</text>

  <rect class="box" x="24" y="80" width="320" height="112" rx="8"/>
  <text class="name" x="184" y="108">Agent program</text>
  <text class="sub" x="184" y="128">runs inside the sandbox</text>
  <text class="sub" x="184" y="150">model credential =</text>
  <text class="sub" x="184" y="164">an opaque placeholder value</text>

  <rect class="box" x="24" y="208" width="320" height="64" rx="8"/>
  <text class="name" x="184" y="236">Isolated terminal</text>
  <text class="sub" x="184" y="254">the same placeholder</text>

  <rect class="focal" x="448" y="80" width="272" height="112" rx="8"/>
  <text class="name" x="584" y="116">Sandbox outbound proxy</text>
  <text class="sub" x="584" y="138">the real credentials live here</text>
  <text class="sub" x="584" y="158">added when host · method · path match</text>

  <rect class="box" x="448" y="248" width="272" height="64" rx="8"/>
  <text class="name" x="584" y="276">AstraBox service</text>
  <text class="sub" x="584" y="294">Credential Vault · real values</text>

  <rect class="box" x="848" y="48" width="208" height="64" rx="8"/>
  <text class="name" x="952" y="76">Model gateway</text>
  <text class="sub" x="952" y="94">LiteLLM or your own</text>

  <rect class="box" x="848" y="160" width="208" height="64" rx="8"/>
  <text class="name" x="952" y="188">Allowed API host</text>
  <text class="sub" x="952" y="206">api.example.com</text>

  <line class="rule" x1="24" y1="336" x2="1056" y2="336"/>
  <text class="eyebrow" x="24" y="360">LEGEND</text>
  <rect class="focal" x="112" y="352" width="16" height="10" rx="2"/>
  <text class="legend-text" x="136" y="360">where the real credential is added</text>
  <line class="edge" x1="344" y1="357" x2="368" y2="357"/>
  <text class="legend-text" x="376" y="360">what a sandbox process sends</text>
  <line class="edge-dashed" x1="560" y1="357" x2="584" y2="357"/>
  <text class="legend-text" x="592" y="360">written after the sandbox starts</text>
  <line class="edge-out" x1="800" y1="357" x2="824" y2="357"/>
  <text class="legend-text" x="832" y="360">carries the real credential</text>
</svg>
