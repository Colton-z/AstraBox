name: installer

# Runs scripts/install.sh the way a first-time user runs it — piped into bash,
# non-interactive, on a clean GitHub-hosted runner — and proves the stack it
# starts serves the console, answers the API and gives a Session a real sandbox.
#
# Nothing is published from this workflow. It builds, from this commit, the
# release bundle and the two images a fresh installation pulls (the server and
# the Claude Code sandbox) into a registry on the runner, and points the
# installer at that registry with ASTRABOX_IMAGE_PREFIX, the documented setting
# for a registry mirror. The installer then pulls exactly as it would from
# ghcr.io.
#
# Checks (scripts/installer-acceptance.sh):
#   * the console page is served and /healthz reports the bundle's version;
#   * the API lists the seeded Claude Code Agent;
#   * a Session for it reaches READY, and the sandbox runs the Agent image the
#     installation resolved from ASTRABOX_IMAGE_PREFIX and the bundle's version;
#   * re-running the installer keeps every generated secret, the database and
#     the Session created before it.
#
# One real model turn runs only when the repository secret DEEPSEEK_API_KEY is
# set (Settings ▸ Secrets and variables ▸ Actions ▸ Secrets). Without it that
# step is skipped with a notice; pull requests from forks never receive it.

on:
  pull_request:
    paths:
      - scripts/install.sh
      - scripts/build-release-bundle.sh
      - scripts/installer-acceptance.sh
      - containers/compose.yaml
      - containers/postgres/**
      - containers/coredns/**
      - containers/sandbox-edge/**
      - containers/litellm/**
      - containers/server/**
      - containers/sandbox-claude-code/**
      - astrabox/config/release_images.py
      - astrabox/providers/sandbox_image.py
      - astrabox/deploy/**
      - pyproject.toml
      - .github/workflows/installer.yml
  push:
    branches: [main]
    paths:
      - scripts/install.sh
      - scripts/build-release-bundle.sh
      - scripts/installer-acceptance.sh
      - containers/**
      - astrabox/**
      - frontend/**
      - pyproject.toml
      - .github/workflows/installer.yml
  workflow_dispatch:

concurrency:
  group: installer-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  install:
    name: install.sh on a clean runner
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      HAS_MODEL_KEY: ${{ secrets.DEEPSEEK_API_KEY != '' }}
      REGISTRY_PREFIX: localhost:5000/astrabox-
    defaults:
      run:
        # An explicit bash runs with pipefail, so a failed check piped into
        # `tee` still fails its step.
        shell: bash
    steps:
      - uses: actions/checkout@v7

      # The build cache, the registry and the Docker daemon each hold a copy of
      # the Agent image, about 4 GB; the preinstalled SDKs this job does not
      # use make room for them.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      - id: version
        run: echo "version=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

      - name: Start a registry on the runner
        # A push that reaches the published port before the registry listens
        # fails with a reset connection, so the step waits for its API.
        run: |
          docker run -d --name registry -p 127.0.0.1:5000:5000 registry:2
          timeout 60 bash -c 'until curl -fsS -o /dev/null http://127.0.0.1:5000/v2/; do sleep 1; done'

      - uses: docker/setup-buildx-action@v3
        with:
          # The builder runs in a container; host networking lets it push to
          # the registry on the runner's loopback.
          driver-opts: network=host

      - name: Build the server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: containers/server/Dockerfile
          push: true
          tags: ${{ env.REGISTRY_PREFIX }}server:${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=installer-server
          cache-to: type=gha,mode=max,scope=installer-server

      - name: Build the Claude Code sandbox image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: containers/sandbox-claude-code/Dockerfile
          push: true
          tags: ${{ env.REGISTRY_PREFIX }}sandbox-claude-code:${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=installer-sandbox-claude-code
          cache-to: type=gha,mode=max,scope=installer-sandbox-claude-code

      - name: Build the deployment bundle
        run: scripts/build-release-bundle.sh "$RUNNER_TEMP/bundle"

      - name: Install without a model service
        env:
          ASTRABOX_INSTALL_BUNDLE: ${{ runner.temp }}/bundle/astrabox-deploy-${{ steps.version.outputs.version }}.tar.gz
          ASTRABOX_INSTALL_DIR: ${{ runner.temp }}/astrabox
          ASTRABOX_IMAGE_PREFIX: ${{ env.REGISTRY_PREFIX }}
          ASTRABOX_INSTALL_MODEL_PROVIDER: none
        # The script arrives on stdin, as it does from `curl ... | bash`.
        run: bash < scripts/install.sh

      - name: Console, API and a READY Session
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          scripts/installer-acceptance.sh http://127.0.0.1:8088 "$VERSION" \
            --agent-image "${REGISTRY_PREFIX}sandbox-claude-code:$VERSION" \
            | tee "$RUNNER_TEMP/first-acceptance.log"

      # A health wait shorter than a bundled service's first boot makes the
      # entry point give up, and Compose's restart policy hides it behind a
      # healthy second start; on a slower host it becomes a crash loop.
      - name: The first start needed no restart
        env:
          ASTRABOX_INSTALL_DIR: ${{ runner.temp }}/astrabox
        run: |
          server="$(cd "$ASTRABOX_INSTALL_DIR/containers" && docker compose ps -q server)"
          restarts="$(docker inspect -f '{{.RestartCount}}' "$server")"
          if [ "$restarts" != 0 ]; then
            echo "the server restarted $restarts time(s) during a fresh install" >&2
            docker logs "$server" 2>&1 | tail -60 >&2
            exit 1
          fi

      - name: Re-running the installer keeps secrets and data
        env:
          ASTRABOX_INSTALL_BUNDLE: ${{ runner.temp }}/bundle/astrabox-deploy-${{ steps.version.outputs.version }}.tar.gz
          ASTRABOX_INSTALL_DIR: ${{ runner.temp }}/astrabox
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          secrets_dir="$ASTRABOX_INSTALL_DIR/.astrabox/database-secrets"
          session_id="$(sed -n 's/^PASS: created Session //p' "$RUNNER_TEMP/first-acceptance.log")"
          test -n "$session_id"
          before="$(cd "$secrets_dir" && sha256sum -- *)"
          volume_before="$(docker volume inspect astrabox-postgres --format '{{.CreatedAt}}')"

          bash < scripts/install.sh

          test "$(cd "$secrets_dir" && sha256sum -- *)" = "$before"
          test "$(docker volume inspect astrabox-postgres --format '{{.CreatedAt}}')" = "$volume_before"
          curl -fsS "http://127.0.0.1:8088/api/v1/sessions/$session_id" >/dev/null
          echo "secrets, database volume and Session $session_id survived the re-run"

      - name: One real turn through DeepSeek
        if: env.HAS_MODEL_KEY == 'true'
        env:
          ASTRABOX_INSTALL_BUNDLE: ${{ runner.temp }}/bundle/astrabox-deploy-${{ steps.version.outputs.version }}.tar.gz
          ASTRABOX_INSTALL_DIR: ${{ runner.temp }}/astrabox
          ASTRABOX_INSTALL_MODEL_PROVIDER: deepseek
          ASTRABOX_INSTALL_MODEL_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          bash < scripts/install.sh
          scripts/installer-acceptance.sh http://127.0.0.1:8088 "$VERSION" --turn

      - name: Real turn skipped
        if: env.HAS_MODEL_KEY != 'true'
        run: echo "::notice::The DEEPSEEK_API_KEY secret is not set, so no model turn ran."

      - name: Stack state on failure (credentials filtered)
        if: failure()
        working-directory: ${{ runner.temp }}/astrabox/containers
        run: |
          docker compose ps -a || true
          docker compose logs --no-color --tail 200 server 2>&1 \
            | grep -Eiv 'api_key|auth_token|secret|password' || true
          docker ps -a --format '{{.Names}}  {{.Image}}  {{.Status}}' || true
