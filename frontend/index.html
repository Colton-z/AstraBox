<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AstraBox</title>
    <script>
      // The application cannot report a failure to download its own entry.
      (() => {
        let entry;
        let retryScript;
        let attempts = 0;
        let timer;
        const retryEntry = (event) => {
          const script = event.target;
          if (!(script instanceof HTMLScriptElement) || script.type !== 'module') return;
          if (!/\/(?:assets\/main-[\w-]+\.js|src\/main\.tsx)$/.test(new URL(script.src).pathname)) return;
          if (entry && script !== entry && script !== retryScript) return;
          entry = entry || script;
          if (timer) return;
          attempts += 1;
          const status = document.getElementById('app-loading');
          if (status) status.textContent = `Unable to load AstraBox. Retrying (${attempts})…`;
          timer = setTimeout(() => {
            timer = undefined;
            if (retryScript) retryScript.remove();
            retryScript = document.createElement('script');
            retryScript.type = 'module';
            retryScript.crossOrigin = entry.crossOrigin;
            const url = new URL(entry.src);
            // A failed module URL remains in the browser's module map.
            url.searchParams.set('_entry_retry', String(attempts));
            retryScript.src = url.href;
            retryScript.onload = () => window.removeEventListener('error', retryEntry, true);
            document.head.appendChild(retryScript);
          }, Math.min(1000 * 2 ** Math.min(attempts - 1, 3), 5000));
        };
        window.addEventListener('error', retryEntry, true);
      })();
    </script>
    <!-- Fonts must not block first paint in restricted networks (e.g. no Internet). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap"
      />
    </noscript>
  </head>
  <body>
    <div id="root">
      <div id="app-loading" role="status" style="min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; font: 14px system-ui; color: #666; text-align: center;">
        Loading AstraBox…
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
