      <stop offset="0" stop-color="#7877FF"/>
      <stop offset="1" stop-color="#4140E0"/>
    </linearGradient>
    <mask id="astraStar">
      <rect width="32" height="32" fill="#fff"/>
      <path d="M16 6.2C16.55 11.4 20.6 15.45 25.8 16C20.6 16.55 16.55 20.6 16 25.8C15.45 20.6 11.4 16.55 6.2 16C11.4 15.45 15.45 11.4 16 6.2Z" fill="#000"/>
    </mask>
  </defs>
  <rect width="32" height="32" rx="7.5" fill="url(#astraTile)" mask="url(#astraStar)"/>
</svg>
