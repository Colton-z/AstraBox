<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" id="fig-opensandbox-pools" viewBox="0 0 1080 488"
     role="img" aria-labelledby="opensandbox-pools-title opensandbox-pools-desc">
  <title id="opensandbox-pools-title">准备容量如何交给 Session</title>
  <desc id="opensandbox-pools-desc">启用预热的 Agent 会保留一个准备完成的运行时。Agent tenancy 使用 OpenSandbox 官方 SDK client pool 提供共用基础沙箱，再由 AstraBox 在其中准备一个隔离的引擎 slot。conversation tenancy 由 AstraBox 为一段对话准备一个完整沙箱。Session 会原子领取匹配的准备单元；没有可领取单元时，普通启动路径使用同一份当前 Agent 配置。</desc>

  <style data-standalone="true">
    @media (prefers-color-scheme: dark) {
      svg {
        --ifm-background-color: #0e0e0e;
        --fg-1: #ededed;
        --fg-3: #909090;
        --fg-4: #6f6f6f;
        --line-strong: #383838;
        --astra: #7877ff;
        --astra-tint: #1a1b3a;
      }
    }
  </style>

  <style>
    #fig-opensandbox-pools .box { fill: var(--ifm-background-color, #fafafa); stroke: var(--line-strong, #d4d4d4); stroke-width: 1 }
    #fig-opensandbox-pools .focal { fill: var(--astra-tint, #ecebff); stroke: var(--astra, #5c5bff); stroke-width: 1.5 }
    #fig-opensandbox-pools .mask { fill: var(--ifm-background-color, #fafafa) }
    #fig-opensandbox-pools .edge { fill: none; stroke: var(--fg-4, #999999); stroke-width: 1.25 }
    #fig-opensandbox-pools .name { fill: var(--fg-1, #0a0a0a); font: 600 12px Geist, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; text-anchor: middle }
    #fig-opensandbox-pools .sub { fill: var(--fg-3, #666666); font: 400 10px "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; text-anchor: middle }
    #fig-opensandbox-pools .eyebrow { fill: var(--fg-3, #666666); font: 500 9px "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; letter-spacing: 0.14em }
    #fig-opensandbox-pools .arrow-label { fill: var(--fg-3, #666666); font: 400 9px "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; letter-spacing: 0.06em; text-anchor: middle }
    #fig-opensandbox-pools .legend-text { fill: var(--fg-3, #666666); font: 400 9px "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; letter-spacing: 0.06em }
    #fig-opensandbox-pools .rule { stroke: var(--line-strong, #d4d4d4); stroke-width: 0.8 }
  </style>

  <defs>
    <marker id="opensandbox-pools-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="var(--fg-4, #999999)"/>
    </marker>
  </defs>

  <!-- column headers -->
  <text class="eyebrow" x="24" y="44">启动路径 · 按 tenancy 和可用状态选择</text>
  <line class="rule" x1="24" y1="56" x2="440" y2="56"/>
  <text class="eyebrow" x="616" y="44">Session 领取或启动的运行时</text>
  <line class="rule" x1="616" y1="56" x2="1056" y2="56"/>

  <!-- arrows first: the boxes paint over the lines -->
  <path class="edge" d="M 440 124 H 520 V 224 H 612" marker-end="url(#opensandbox-pools-arrow)"/>
  <path class="edge" d="M 440 244 H 612" marker-end="url(#opensandbox-pools-arrow)"/>
  <path class="edge" d="M 440 364 H 544 V 264 H 612" marker-end="url(#opensandbox-pools-arrow)"/>

  <rect class="focal" x="24" y="88" width="416" height="72" rx="8"/>
  <text class="name" x="232" y="112">Agent tenancy · 共用沙箱</text>
  <text class="sub" x="232" y="130">OpenSandbox SDK client pool 保留一个基础沙箱</text>
  <text class="sub" x="232" y="144">AstraBox 在其中准备一个隔离的引擎 slot</text>

  <rect class="box" x="24" y="208" width="416" height="72" rx="8"/>
  <text class="name" x="232" y="232">conversation tenancy · 独立沙箱</text>
  <text class="sub" x="232" y="250">AstraBox 保留一个准备完成的完整沙箱</text>
  <text class="sub" x="232" y="264">领取它的对话接管对应工作区</text>

  <rect class="box" x="24" y="328" width="416" height="72" rx="8"/>
  <text class="name" x="232" y="352">普通启动</text>
  <text class="sub" x="232" y="370">没有可领取的匹配准备单元时使用</text>
  <text class="sub" x="232" y="384">创建或加入 Agent 的当前运行位置</text>

  <rect class="box" x="616" y="208" width="440" height="72" rx="8"/>
  <text class="name" x="836" y="232">Session 运行时</text>
  <text class="sub" x="836" y="250">原子领取一个准备单元，或立即执行普通启动</text>
  <text class="sub" x="836" y="264">工作区和受保护凭证随 Session 交接</text>

  <line class="rule" x1="24" y1="432" x2="1056" y2="432"/>
  <text class="eyebrow" x="24" y="456">图例</text>
  <rect class="focal" x="112" y="448" width="16" height="12" rx="2"/>
  <text class="legend-text" x="136" y="456">由 provider 管理的基础沙箱容量</text>
  <text class="eyebrow" x="336" y="456">说明</text>
  <text class="legend-text" x="380" y="456">AstraBox 负责配方、领取、工作区、凭证和启动</text>
</svg>
