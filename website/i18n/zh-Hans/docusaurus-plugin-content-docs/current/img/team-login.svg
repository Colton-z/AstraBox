<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" id="fig-team-login" viewBox="0 0 1080 568"
     role="img" aria-labelledby="team-login-title team-login-desc">
  <title id="team-login-title">浏览器如何登录 AstraBox</title>
  <desc id="team-login-desc">浏览器在没有登录 Cookie 的情况下打开 AstraBox 控制台，AstraBox 带上 PKCE Challenge 把它重定向到身份提供商。用户在仓库自带的 Casdoor 或组织已有的身份提供商完成登录，身份提供商带一次性 Code 把浏览器重定向回 /api/v1/auth/callback。AstraBox 用这个 Code、PKCE Verifier 和 Client Secret 换取包含用户与用户组的 ID Token，验证后返回自己签名的 HttpOnly 登录 Cookie。</desc>

  <style data-standalone="true">
    @media (prefers-color-scheme: dark) {
      svg {
        --ifm-background-color: #0e0e0e;
        --fg-1: #ededed;
        --fg-3: #909090;
        --fg-4: #6f6f6f;
        --line-strong: #383838;
        --astra: #7877ff;
        --astra-tint: #1a1b3a;
      }
    }
  </style>

  <style>
    #fig-team-login .box { fill: var(--ifm-background-color, #fafafa); stroke: var(--line-strong, #d4d4d4); stroke-width: 1 }
    #fig-team-login .focal { fill: var(--astra-tint, #ecebff); stroke: var(--astra, #5c5bff); stroke-width: 1.5 }
    #fig-team-login .life { fill: none; stroke: var(--line-strong, #d4d4d4); stroke-width: 1; stroke-dasharray: 4 4 }
    #fig-team-login .mask { fill: var(--ifm-background-color, #fafafa) }
    #fig-team-login .edge { fill: none; stroke: var(--fg-4, #999999); stroke-width: 1.25 }
    #fig-team-login .edge-dashed { fill: none; stroke: var(--fg-4, #999999); stroke-width: 1.25; stroke-dasharray: 3 4 }
    #fig-team-login .edge-strong { fill: none; stroke: var(--fg-3, #666666); stroke-width: 2 }
    #fig-team-login .name { fill: var(--fg-1, #0a0a0a); font: 600 12px Geist, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; text-anchor: middle }
    #fig-team-login .sub { fill: var(--fg-3, #666666); font: 400 10px "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; text-anchor: middle }
    #fig-team-login .eyebrow { fill: var(--fg-3, #666666); font: 500 9px "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; letter-spacing: 0.14em }
    #fig-team-login .arrow-label { fill: var(--fg-3, #666666); font: 400 9px "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; letter-spacing: 0.06em; text-anchor: middle }
    #fig-team-login .legend-text { fill: var(--fg-3, #666666); font: 400 9px "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; letter-spacing: 0.06em }
    /* an untranslated route keeps the code size the English figure uses */
    #fig-team-login .route { font-size: 8px }
    #fig-team-login .rule { stroke: var(--line-strong, #d4d4d4); stroke-width: 0.8 }
  </style>

  <defs>
    <marker id="team-login-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="var(--fg-4, #999999)"/>
    </marker>
    <marker id="team-login-arrow-strong" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="var(--fg-3, #666666)"/>
    </marker>
  </defs>

  <!-- lifelines first, then messages, then masks and their labels, then the actors -->
  <line class="life" x1="124" y1="128" x2="124" y2="472"/>
  <line class="life" x1="540" y1="128" x2="540" y2="472"/>
  <line class="life" x1="956" y1="128" x2="956" y2="472"/>

  <path class="edge" d="M 128 168 H 536" marker-end="url(#team-login-arrow)"/>
  <path class="edge-dashed" d="M 536 208 H 128" marker-end="url(#team-login-arrow)"/>
  <path class="edge" d="M 128 248 H 952" marker-end="url(#team-login-arrow)"/>
  <path class="edge-dashed" d="M 952 288 H 128" marker-end="url(#team-login-arrow)"/>
  <path class="edge" d="M 128 328 H 536" marker-end="url(#team-login-arrow)"/>
  <path class="edge" d="M 544 368 H 952" marker-end="url(#team-login-arrow)"/>
  <path class="edge-dashed" d="M 952 408 H 544" marker-end="url(#team-login-arrow)"/>
  <path class="edge-strong" d="M 536 448 H 128" marker-end="url(#team-login-arrow-strong)"/>

  <rect class="mask" x="276" y="148" width="112" height="12" rx="2"/>
  <text class="arrow-label" x="332" y="156">打开控制台，尚未登录</text>
  <rect class="mask" x="232" y="188" width="200" height="12" rx="2"/>
  <text class="arrow-label" x="332" y="196">重定向到身份提供商，带 PKCE Challenge</text>
  <rect class="mask" x="650" y="228" width="196" height="12" rx="2"/>
  <text class="arrow-label" x="748" y="236">身份提供商验证用户，并向 AstraBox 返回身份信息</text>
  <rect class="mask" x="264" y="268" width="136" height="12" rx="2"/>
  <text class="arrow-label" x="332" y="276">带一次性 Code 重定向回来</text>
  <rect class="mask" x="258" y="308" width="148" height="12" rx="2"/>
  <text class="arrow-label route" x="332" y="316">GET /api/v1/auth/callback</text>
  <rect class="mask" x="642" y="348" width="212" height="12" rx="2"/>
  <text class="arrow-label" x="748" y="356">Code、PKCE Verifier、Client Secret</text>
  <rect class="mask" x="684" y="388" width="128" height="12" rx="2"/>
  <text class="arrow-label" x="748" y="396">ID Token：用户与用户组</text>
  <rect class="mask" x="238" y="428" width="188" height="12" rx="2"/>
  <text class="arrow-label" x="332" y="436">签名的 HttpOnly 登录 Cookie</text>

  <rect class="box" x="24" y="64" width="200" height="64" rx="8"/>
  <text class="name" x="124" y="92">浏览器</text>
  <text class="sub" x="124" y="110">正在登录的用户</text>

  <rect class="box" x="440" y="64" width="200" height="64" rx="8"/>
  <text class="name" x="540" y="92">AstraBox 服务</text>
  <text class="sub" x="540" y="110">验证 ID Token</text>

  <rect class="focal" x="856" y="64" width="200" height="64" rx="8"/>
  <text class="name" x="956" y="92">身份提供商</text>
  <text class="sub" x="956" y="110">自带 Casdoor 或组织已有服务</text>

  <line class="rule" x1="24" y1="504" x2="1056" y2="504"/>
  <text class="eyebrow" x="24" y="528">图例</text>
  <rect class="focal" x="112" y="520" width="16" height="12" rx="2"/>
  <text class="legend-text" x="136" y="528">你配置的身份提供商</text>
  <line class="edge" x1="232" y1="525" x2="256" y2="525"/>
  <text class="legend-text" x="264" y="528">登录过程的一步</text>
  <line class="edge-dashed" x1="352" y1="525" x2="376" y2="525"/>
  <text class="legend-text" x="384" y="528">这一步的返回</text>
  <line class="edge-strong" x1="460" y1="525" x2="484" y2="525"/>
  <text class="legend-text" x="492" y="528">AstraBox 创建的登录 Cookie</text>
</svg>
