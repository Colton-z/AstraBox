<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" id="fig-working-with-repos" viewBox="0 0 1080 400"
     role="img" aria-labelledby="working-with-repos-title working-with-repos-desc">
  <title id="working-with-repos-title">代码仓库如何进入 Session</title>
  <desc id="working-with-repos-desc">Agent 可以指定一个默认项目仓库，以及包含 Skill 或 Plugin 的固定版本仓库。AstraBox 在服务端读取所需部署密钥，在第一轮任务前克隆项目，并安装选中的扩展目录。Agent 程序在 Session 工作区中读写文件。推送分支或下载文件可以让成果在沙箱终止后继续保留。</desc>

  <style data-standalone="true">
    @media (prefers-color-scheme: dark) {
      svg {
        --ifm-background-color: #0e0e0e;
        --fg-1: #ededed;
        --fg-3: #909090;
        --fg-4: #6f6f6f;
        --line-strong: #383838;
        --astra: #7877ff;
        --astra-tint: #1a1b3a;
        --plasma: #f08a59;
      }
    }
  </style>

  <style>
    #fig-working-with-repos .box { fill: var(--ifm-background-color, #fafafa); stroke: var(--line-strong, #d4d4d4); stroke-width: 1 }
    #fig-working-with-repos .store { fill: color-mix(in oklab, var(--fg-1, #0a0a0a) 5%, var(--ifm-background-color, #fafafa)); stroke: var(--line-strong, #d4d4d4); stroke-width: 1 }
    #fig-working-with-repos .focal { fill: var(--astra-tint, #ecebff); stroke: var(--astra, #5c5bff); stroke-width: 1.5 }
    #fig-working-with-repos .zone { fill: none; stroke: var(--line-strong, #d4d4d4); stroke-width: 1; stroke-dasharray: 4 4 }
    #fig-working-with-repos .mask { fill: var(--ifm-background-color, #fafafa) }
    #fig-working-with-repos .edge { fill: none; stroke: var(--fg-4, #999999); stroke-width: 1.25 }
    #fig-working-with-repos .edge-out { fill: none; stroke: var(--plasma, #e8754a); stroke-width: 1.25 }
    #fig-working-with-repos .name { fill: var(--fg-1, #0a0a0a); font: 600 12px Geist, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; text-anchor: middle }
    #fig-working-with-repos .sub { fill: var(--fg-3, #666666); font: 400 10px "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; text-anchor: middle }
    #fig-working-with-repos .eyebrow { fill: var(--fg-3, #666666); font: 500 9px "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; letter-spacing: 0.14em }
    #fig-working-with-repos .arrow-label { fill: var(--fg-3, #666666); font: 400 9px "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; letter-spacing: 0.06em; text-anchor: middle }
    #fig-working-with-repos .legend-text { fill: var(--fg-3, #666666); font: 400 9px "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; letter-spacing: 0.06em }
    #fig-working-with-repos .rule { stroke: var(--line-strong, #d4d4d4); stroke-width: 0.8 }
  </style>

  <defs>
    <marker id="working-with-repos-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="var(--fg-4, #999999)"/>
    </marker>
    <marker id="working-with-repos-arrow-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto">
      <polygon points="8 0, 0 3, 8 6" fill="var(--fg-4, #999999)"/>
    </marker>
    <marker id="working-with-repos-arrow-out" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="var(--plasma, #e8754a)"/>
    </marker>
  </defs>

  <!-- zone first, then arrows, then boxes: nodes paint over the lines -->
  <rect class="zone" x="504" y="56" width="328" height="248" rx="12"/>
  <text class="eyebrow" x="504" y="44">受管沙箱</text>

  <path class="edge" d="M 200 120 H 216 V 160 H 228" marker-end="url(#working-with-repos-arrow)"/>
  <path class="edge" d="M 200 232 H 216 V 192 H 228" marker-end="url(#working-with-repos-arrow)"/>
  <path class="edge" d="M 408 160 H 440 V 120 H 532" marker-end="url(#working-with-repos-arrow)"/>
  <path class="edge" d="M 408 192 H 440 V 240 H 532" marker-end="url(#working-with-repos-arrow)"/>
  <path class="edge" d="M 668 156 V 204" marker-end="url(#working-with-repos-arrow)" marker-start="url(#working-with-repos-arrow-start)"/>
  <path class="edge-out" d="M 800 240 H 876" marker-end="url(#working-with-repos-arrow-out)"/>

  <rect class="mask" x="452" y="100" width="72" height="12" rx="2"/>
  <text class="arrow-label" x="488" y="109">clone 仓库</text>
  <rect class="mask" x="448" y="220" width="80" height="12" rx="2"/>
  <text class="arrow-label" x="488" y="229">Skill 与 Plugin</text>
  <rect class="mask" x="678" y="178" width="96" height="12" rx="2"/>
  <text class="arrow-label" x="726" y="187">读取 · 修改 · 提交</text>
  <rect class="mask" x="804" y="220" width="72" height="12" rx="2"/>
  <text class="arrow-label" x="840" y="229">clone · push</text>

  <rect class="box" x="24" y="88" width="176" height="64" rx="8"/>
  <text class="name" x="112" y="110">Agent 配置</text>
  <text class="sub" x="112" y="126">default_repo · SSH 地址</text>
  <text class="sub" x="112" y="140">plugin_repos · 固定 sha</text>

  <rect class="store" x="24" y="200" width="176" height="64" rx="8"/>
  <text class="name" x="112" y="222">服务端密钥来源</text>
  <text class="sub" x="112" y="238">deploy_key_secret_name</text>
  <text class="sub" x="112" y="252">服务端环境变量</text>

  <rect class="box" x="232" y="144" width="176" height="64" rx="8"/>
  <text class="name" x="320" y="172">AstraBox 服务</text>
  <text class="sub" x="320" y="190">第一次执行任务前 clone</text>

  <rect class="focal" x="536" y="88" width="264" height="64" rx="8"/>
  <text class="name" x="668" y="110">Session 工作区</text>
  <text class="sub" x="668" y="126">每个 Session 重新 clone</text>
  <text class="sub" x="668" y="140">暂停时保存快照 · 终止时释放</text>

  <rect class="box" x="536" y="208" width="264" height="64" rx="8"/>
  <text class="name" x="668" y="230">Agent 程序</text>
  <text class="sub" x="668" y="246">沙箱镜像自带 git</text>
  <text class="sub" x="668" y="260">可按要求 clone 公开仓库</text>

  <rect class="box" x="880" y="208" width="176" height="64" rx="8"/>
  <text class="name" x="968" y="230">代码托管服务</text>
  <text class="sub" x="968" y="246">github.com 或自建</text>
  <text class="sub" x="968" y="260">沙箱需要能访问</text>

  <line class="rule" x1="24" y1="336" x2="1056" y2="336"/>
  <text class="eyebrow" x="24" y="360">图例</text>
  <rect class="focal" x="112" y="352" width="16" height="10" rx="2"/>
  <text class="legend-text" x="136" y="360">仓库最终所在的位置</text>
  <line class="edge" x1="416" y1="357" x2="440" y2="357"/>
  <text class="legend-text" x="448" y="360">配置、密钥与文件</text>
  <line class="edge-out" x1="728" y1="357" x2="752" y2="357"/>
  <text class="legend-text" x="760" y="360">离开沙箱</text>
</svg>
